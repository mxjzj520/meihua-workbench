<style>
#wb-startup{position:fixed;inset:0;z-index:2147483647;background:#fff;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#wb-startup img{width:min(340px,70vw);height:auto;display:block}
#wb-startup[hidden],#wb-update[hidden]{display:none!important}
#wb-update{position:fixed;z-index:10000;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:16px;max-width:calc(100vw - 28px);padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface,#fff);color:var(--ink);box-shadow:0 8px 32px #00000012;font:13px var(--ui-font)}
#wb-update p{margin:0;white-space:nowrap}#wb-update .quiet-button{font-size:13px;padding:7px 12px}#wb-update svg{width:16px;height:16px}
.wb-install-guide{font-size:13px;line-height:1.9}.wb-install-guide p{margin:0 0 12px}.wb-install-guide ol{padding-left:20px}.wb-install-guide img{display:block;width:104px;height:104px;object-fit:contain;margin:0 auto 16px}
@media(display-mode:fullscreen),(display-mode:standalone){[data-wb-install]{display:none!important}}
</style>
<style>@charset "UTF-8";
:root{--ink:#2f2f2f;--muted:#878787;--line:rgba(75,75,75,.1);--accent:#6b6b6b;--accent-soft:#eaeaea;--green:#878787;--panel:rgba(255,255,255,.68);--ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;--chat-width:40%;--ui-bg:none;font-family:var(--ui-font);font-size:14px;color:var(--ink);background:#f1f1f1}

*{box-sizing:border-box}
body{margin:0;height:var(--app-height,100dvh);min-height:480px;overflow:hidden;background-image:var(--ui-bg);background-size:cover;background-position:center}
button,input,textarea,select{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:wait;opacity:.5}
button:focus-visible,a:focus-visible{outline:1px solid var(--focus);outline-offset:3px}
input:focus,textarea:focus,select:focus{outline:1px solid var(--focus);outline-offset:0}
a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
textarea{resize:vertical;line-height:1.7}
input,textarea,select{min-width:0}
button{transition:background .16s,border-color .16s}
button:hover{background:rgba(82,82,82,.055)}
.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 18% 8%,rgba(214,214,214,.55),transparent 42%),radial-gradient(ellipse at 95% 95%,rgba(224,224,224,.52),transparent 48%)}
.app{position:relative;display:flex;height:100%;padding:16px;gap:14px;max-width:2000px;margin:auto}
.sidebar{width:218px;flex-shrink:0;display:flex;flex-direction:column;padding:22px 10px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px;font-size:18px;font-weight:650;letter-spacing:1px}
.brand-symbol{background:#e0e0e0;border:1px solid rgba(255,255,255,.8);border-radius:13px;width:39px;height:43px;display:grid;place-items:center;color:var(--muted)}
.brand-symbol svg{width:23px;height:23px}
.brand-sub{display:block;font-size:9px;letter-spacing:1.7px;color:var(--muted);font-weight:500;margin-top:5px}
.new-project{display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:11px;padding:12px 14px;font-size:13px}
.shortcut{margin-left:auto;color:var(--muted)}
.side-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:1px;padding:28px 12px 12px}
.side-label span{letter-spacing:0}
.project-list{flex:1;overflow:auto;min-height:80px}
.project-item{display:flex;align-items:center;width:100%;gap:9px;padding:12px;border-radius:10px;text-align:left;margin-bottom:5px}
.project-item.active{background:#e2e2e2;color:var(--muted)}
.project-item .project-icon{width:27px;height:30px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center}
.project-item svg{width:15px;height:15px}
.project-item .project-item-title{display:block;max-width:140px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;font-size:12px}
.project-item small{font-size:10px;display:block;color:var(--muted);margin-top:5px}
.sidebar-bottom{padding-top:15px}
.local-badge{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:10px 12px}
.local-badge>span:last-child{margin-left:auto}
.status-dot,.mini-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#989898;flex-shrink:0}
.side-action{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left;font-size:12px;border-radius:8px;color:var(--muted)}
.side-action svg{width:16px}
.sidebar-foot{font-size:10px;color:var(--muted);padding:20px 12px 0;letter-spacing:1px}
.main{flex:1;min-width:0;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.52);backdrop-filter:blur(24px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 45px rgba(71,71,71,.035)}
.topbar{height:87px;flex-shrink:0;display:flex;align-items:center;padding:0 26px;border-bottom:1px solid var(--line);gap:12px;background:rgba(255,255,255,.28)}
.project-heading{min-width:0}
.breadcrumb{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-bottom:7px}
.breadcrumb span{margin-left:9px}
.project-title{padding:0;text-align:left;font-size:17px;font-weight:600;letter-spacing:.3px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
.save-state{color:var(--muted);font-size:10px;white-space:nowrap}
.save-state.error{color:var(--muted)}
.quiet-button,.primary-button,.export-button,.danger-button{display:inline-flex;justify-content:center;align-items:center;gap:7px;border-radius:8px;padding:9px 13px;font-size:12px;white-space:nowrap}
.quiet-button{border:1px solid var(--line);background:rgba(255,255,255,.3)}
.primary-button{background:var(--accent);color:white;border:1px solid transparent}
.primary-button:hover{background:#5e5e5e}
.primary-button svg{width:15px}
.danger-button{background:#e9e9e9;color:var(--muted)}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;color:var(--muted);flex-shrink:0}
.icon-button svg{width:17px;height:17px}
.workspace{display:flex;flex:1;min-height:0}
.chat-pane{display:flex;flex-direction:column;min-width:300px;flex:0 0 var(--chat-width);overflow:hidden}
.pane-header{display:flex;align-items:center;justify-content:space-between;padding:28px 28px 16px;flex-shrink:0}
.tiny-label{font-size:10px;letter-spacing:2px;color:var(--muted)}
h2{font-size:19px;font-weight:550;margin:10px 0 0;letter-spacing:.5px}
.chat-scroll{flex:1;min-height:0;overflow:auto;padding:10px 28px 22px;scroll-behavior:smooth;overscroll-behavior:contain}
.welcome{margin-top:12px;padding:22px 20px;border:1px solid rgba(255,255,255,.95);border-radius:13px;background:rgba(255,255,255,.46)}
.welcome-top{display:flex;gap:10px;align-items:center}
.assistant-symbol{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:#e6e6e6;color:var(--muted)}
.assistant-symbol svg{width:16px}
.welcome h3{font-size:13px;margin:0;font-weight:550}
.welcome p{font-size:12px;line-height:1.95;color:var(--muted);margin:12px 0 0}
.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.suggestion{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--muted);text-align:left;background:rgba(255,255,255,.35)}
.welcome-foot{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:16px}
.welcome-foot svg{width:12px;height:12px}
.message{margin-top:23px}
.message-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:10px;color:var(--muted)}
.message-head input{accent-color:var(--accent);width:12px;height:12px;margin:0}
.message-head .spacer{flex:1}
.message-head .icon-button{width:22px;height:22px}
.message-head svg{width:12px;height:12px}
.message-body{font-size:12px;line-height:1.85;overflow-wrap:anywhere;white-space:pre-wrap}
.message.user .message-content{background:#eaeaea;border:1px solid rgba(109,109,109,.07);padding:12px 15px;border-radius:12px 12px 3px 12px}
.message.assistant .message-content{background:rgba(255,255,255,.68);border:1px solid var(--line);padding:12px 15px;border-radius:3px 12px 12px}
.message.excluded{opacity:.5}
.message-status{color:var(--muted);font-size:9px}
.message-code{margin-top:9px}
.message-code summary{font-size:11px;color:var(--muted);cursor:pointer}
.message-code pre{font-size:10px;max-height:250px;overflow:auto;white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px}
.composer-area{padding:0 22px 13px;flex-shrink:0}
.request-meta{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 4px 10px}
.request-meta button{display:flex;align-items:center;gap:6px;padding:0;text-align:left;min-width:0;max-width:75%}
.request-meta button>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.request-meta svg{width:11px;height:11px}
.composer{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.75)}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:none;max-height:180px;min-height:62px;font-size:12px;line-height:1.8;padding:3px 4px}
.composer textarea:focus{outline:none}
.composer:focus-within{border-color:var(--line)}
.composer textarea::placeholder{color:var(--muted)}
.composer-tools{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:5px}
.composer-tools>div{display:flex;align-items:center;gap:5px}
.text-button{padding:6px;font-size:10px;color:var(--muted)}
.text-button span{font-size:9px;padding:1px 4px;background:#eaeaea;border-radius:3px;margin-left:3px}
.composer-tools .quiet-button,.composer-tools .primary-button{padding:8px 11px;font-size:11px}
.composer-tools .quiet-button{border:0}
.composer-note{font-size:9px;color:var(--muted);text-align:center;padding-top:10px;line-height:1.7}
.splitter{width:1px;background:var(--line);cursor:col-resize;position:relative;flex-shrink:0;z-index:2}
.splitter:after{content:"";position:absolute;inset:0 -4px}
.splitter:hover{background:#a6a6a6}
.work-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:rgba(247,247,247,.38)}
.work-header{height:61px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);gap:10px;flex-shrink:0}
.work-tabs{display:flex;align-items:center;gap:18px;height:100%}
.work-tabs button{font-size:12px;padding:0 1px;height:100%;color:var(--muted);position:relative}
.work-tabs button.active{color:var(--muted)}
.work-tabs button.active:after{content:"";position:absolute;bottom:0;left:3px;right:3px;height:2px;background:#8f8f8f;border-radius:2px}
.work-header-actions{display:flex;align-items:center;gap:7px}
.version-tag{font-size:9px;padding:3px 6px;background:#eaeaea;border-radius:4px;color:var(--muted)}
.export-button{font-size:11px;background:rgba(255,255,255,.6);border:1px solid var(--line);padding:7px 10px}
.export-button svg{width:14px;height:14px}
.work-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.preview-toolbar{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.segmented{display:flex;padding:3px;background:#e7e7e7;border-radius:7px;gap:2px}
.segmented button{padding:5px 11px;font-size:10px;color:var(--muted);border-radius:5px}
.segmented button.active{background:rgba(255,255,255,.8);color:var(--muted);box-shadow:0 1px 3px #6868680a}
.preview-actions{display:flex;align-items:center;gap:6px}
.width-label{font-size:9px;color:var(--muted);white-space:nowrap}
.preview-stage{margin:0 20px 12px;flex:1;min-height:260px;border-radius:12px;background:#eaeaea;background-image:radial-gradient(ellipse at 15% 0%,#f0f0f0,transparent 60%),radial-gradient(ellipse at 100% 100%,#dadada,transparent 70%);border:1px solid var(--line);overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:26px 18px;position:relative}
.preview-stage.dark{background:#282828;background-image:none}
.preview-stage.checker{background-color:#ffffff;background-image:linear-gradient(45deg,#eeeeee 25%,transparent 25%),linear-gradient(-45deg,#eeeeee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eeeeee 75%),linear-gradient(-45deg,transparent 75%,#eeeeee 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview-frame-shell{margin:0 auto;flex-shrink:0;max-width:none;position:relative;transition:width .2s}
.preview-frame-shell iframe{display:block;border:0;width:100%;height:430px;background:transparent;color-scheme:light;min-height:180px}
.preview-status{margin:0 20px 12px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px;line-height:1.6;flex-wrap:wrap}
.preview-status.warn{color:var(--muted)}
.preview-status.error{color:var(--muted)}
.preview-status .preview-detail{margin-left:auto;color:var(--muted);font-size:9px}
.sample-panel{padding:0 20px 19px}
.sample-panel details{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sample-panel summary{padding:12px 13px;font-size:11px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sample-panel summary span{font-size:9px;color:var(--muted)}
.sample-panel textarea{border:0;border-top:1px solid var(--line);background:rgba(255,255,255,.4);padding:12px;width:100%;font-family:ui-monospace,Consolas,monospace;font-size:11px;min-height:155px;resize:vertical;display:block}
.preview-bottom{padding:0 20px 17px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);gap:10px}
.preview-bottom button{font-size:10px;color:var(--muted);padding:3px}






.editor-view,.test-view,.resources-view{padding:20px;display:flex;flex-direction:column;gap:15px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{font-size:11px;border:1px solid var(--line);padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.35);color:var(--muted)}
.subtabs button.active{background:#e3e3e3;color:var(--muted);border-color:var(--line)}
.code-editor{width:100%;height:350px;min-height:240px;border:1px solid var(--line);border-radius:10px;padding:15px;background:rgba(255,255,255,.75);font-family:Consolas,ui-monospace,monospace;line-height:1.7;font-size:11px;tab-size:2;resize:vertical;white-space:pre;overflow-wrap:normal}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.caption{font-size:10px;color:var(--muted);line-height:1.8}
.notice{font-size:11px;line-height:1.85;color:var(--muted);padding:12px 14px;background:#ececec;border:1px solid var(--line);border-radius:9px;overflow-wrap:anywhere}
.notice.warn{background:#f0f0f0;border-color:var(--line);color:var(--muted)}
.notice.error{background:#ececec;color:var(--muted);border-color:var(--line)}
.card{background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:11px;padding:16px}
.card h3{font-size:12px;margin:0 0 12px;font-weight:550}
.card p{font-size:11px;color:var(--muted);line-height:1.9;margin:7px 0}
.form-label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
.form-input{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:rgba(255,255,255,.85);font-size:12px}
.form-row{margin:14px 0}
.form-row small{font-size:10px;line-height:1.8;color:var(--muted);display:block;margin-top:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-inline{display:flex;gap:8px;align-items:center}
.field-inline .form-input{flex:1}
.field-inline .quiet-button{flex-shrink:0}
.checkbox-label{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--muted);line-height:1.8;margin:9px 0}
.checkbox-label input{margin-top:4px;accent-color:var(--accent)}
.case-list{display:flex;flex-direction:column;gap:8px}
.case-item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.4);font-size:11px}
.case-item strong{font-weight:500;flex:1}
.case-result{font-size:10px;color:var(--muted)}
.case-result.fail{color:var(--muted)}
.inline-code{background:#e7e7e7;border-radius:3px;padding:1px 4px;font:10px Consolas,monospace;color:var(--muted)}
pre.output{font:11px/1.8 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;padding:13px;background:#f0f0f0;border-radius:8px}
.file-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:rgba(255,255,255,.55);margin:6px 0;min-width:0;font-size:10px}
.file-chip svg{width:14px;height:14px;color:var(--muted)}
.file-chip .file-info{min-width:0;flex:1}
.file-chip .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.file-chip small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.file-chip img{width:30px;height:30px;object-fit:cover;border-radius:4px}
.file-chip .icon-button{width:22px;height:22px}
.composer-files{max-height:135px;overflow:auto}
.file-content{font:10px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
.font-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px;border-radius:8px;margin-top:8px}
.font-preview{font-size:27px;width:70px;flex-shrink:0;opacity:0}
.font-preview.loaded{opacity:1}
.font-card small{font-size:10px;line-height:1.8;color:var(--muted)}
.font-card>div:nth-child(2){flex:1;font-size:12px}
.resource-list{font-size:10px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}
.modal{border:1px solid rgba(255,255,255,.9);border-radius:17px;padding:0;background:#f9f9f9;color:var(--ink);width:min(650px,calc(100vw - 30px));max-height:87dvh;box-shadow:0 20px 80px #35353525}
.modal::backdrop{background:rgba(46,46,46,.2);backdrop-filter:blur(6px)}
.modal-head{position:sticky;top:0;background:#f9f9f9;display:flex;justify-content:space-between;align-items:center;padding:20px 24px 15px;border-bottom:1px solid var(--line);z-index:5}
.modal-head h2{font-size:16px;margin:0}
.modal-body{padding:5px 24px 24px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:15px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#f9f9f9}
.modal-title-note{font-size:10px;color:var(--muted);margin-top:6px}
.modal .code-editor{height:260px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.choice-card{padding:23px 18px;border:1px solid var(--line);border-radius:11px;text-align:left;background:white}
.choice-card svg{width:25px;height:25px;color:var(--muted);margin-bottom:12px}
.choice-card strong{display:block;font-size:14px;font-weight:550;margin-bottom:8px}
.choice-card small{font-size:11px;color:var(--muted);line-height:1.8;display:block}
.menu-list{display:flex;flex-direction:column;gap:7px;padding-top:15px}
.menu-list button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:#ffffff99}
.menu-list button svg{color:var(--muted)}
.version-entry{padding:14px 0;border-bottom:1px solid var(--line)}

/* Monochrome workbench. Artwork remains inside its own isolated document. */
:root{
  --ink:#202020;--muted:#6c6c6c;--line:rgba(20,20,20,.11);--focus:#737373;
  --accent:#242424;--accent-soft:rgba(25,25,25,.075);--green:#777;
  --page:#ededed;--panel:rgba(255,255,255,.62);--surface:rgba(255,255,255,.68);
  --field:rgba(255,255,255,.8);--subtle:rgba(20,20,20,.035);--hover:rgba(20,20,20,.055);
  --on-accent:#fff;--raised:#fafafa;--stage:#e9e9e9;--blur:28px;
  --glass-edge:rgba(255,255,255,.72);--shadow:0 16px 56px rgba(0,0,0,.045);
  background:var(--page);color:var(--ink);--chat-width:40%;
}
:root[data-appearance="light"]{
  --page:#f6f6f6;--panel:#fff;--surface:#fff;--field:#fff;--raised:#fff;
  --stage:#f2f2f2;--glass-edge:rgba(0,0,0,.09);--blur:0px;--shadow:none;
}
:root[data-appearance="dark"]{
  --ink:#eaeaea;--muted:#a5a5a5;--line:rgba(255,255,255,.12);--focus:#a6a6a6;
  --accent:#e8e8e8;--accent-soft:rgba(255,255,255,.1);--green:#aaa;
  --page:#121212;--panel:#1b1b1b;--surface:#222;--field:#242424;--subtle:rgba(255,255,255,.04);
  --hover:rgba(255,255,255,.07);--on-accent:#161616;--raised:#202020;
  --stage:#151515;--glass-edge:rgba(255,255,255,.1);--blur:0px;--shadow:none;
}
body{background-color:var(--page)}
.ambient{background:radial-gradient(ellipse at 8% 0%,#fff9,transparent 52%),radial-gradient(ellipse at 98% 100%,#b8b8b840,transparent 55%)}
:root[data-appearance="light"] .ambient,:root[data-appearance="dark"] .ambient{display:none}
button{transition:background .16s,border-color .16s,color .16s}
button:hover{background:var(--hover)}
button:focus-visible,a:focus-visible{outline-color:var(--focus)}
input:focus,textarea:focus,select:focus{outline-color:var(--focus)}
input[type="checkbox"]{accent-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.78}
:root[data-appearance="dark"] :is(input,textarea,select){color-scheme:dark}
.app{padding:18px;gap:16px}
.sidebar{width:198px;padding:20px 4px 10px}
.brand{font-size:17px;letter-spacing:.4px;padding-bottom:26px}
.brand-symbol{width:34px;height:38px;border-radius:10px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.brand-sub{font-size:8px;letter-spacing:1.5px;color:var(--muted)}
.new-project{background:var(--surface);border-color:var(--line);font-size:12px;border-radius:9px}
.project-item.active{background:var(--accent-soft);color:var(--ink)}
.project-item.active .project-icon{border-color:var(--line)}
.project-item .project-item-title{max-width:131px}
.side-action{font-size:12px;color:var(--muted)}
.status-dot,.mini-dot,.loading-dot{background:var(--muted)}
.main{border:1px solid var(--glass-edge);border-radius:20px;background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow)}
.topbar{height:76px;padding:0 24px;background:transparent}
.project-title{font-weight:550;font-size:17px}
.breadcrumb{font-size:10px;letter-spacing:0}
.topbar-actions{gap:10px}
.quiet-button,.export-button{background:var(--surface);border-color:var(--line);color:var(--ink)}
.primary-button{background:var(--accent);color:var(--on-accent)}
.primary-button:hover{background:var(--accent);opacity:.86}
.danger-button{background:var(--accent-soft);border:1px dashed var(--muted);color:var(--ink)}
.workspace{min-width:0}
.work-pane{background:transparent}
.chat-pane{min-width:320px;background:var(--subtle)}
.pane-header{padding:27px 24px 16px}
.pane-header h2{font-size:20px;font-weight:500;letter-spacing:-.4px;margin-top:9px}
.tiny-label{font-size:10px;letter-spacing:1px}
.chat-scroll{padding-left:24px;padding-right:24px}
.welcome{margin-top:6px;padding:20px;border-color:var(--line);background:var(--surface);border-radius:12px}
.assistant-symbol{background:var(--accent-soft);color:var(--ink);border-radius:8px}
.welcome p{color:var(--muted);font-size:12px}

.message.user .message-content{background:var(--accent-soft);border-color:var(--line)}
.message.assistant .message-content{background:var(--surface);border-color:var(--line)}
.message-code pre,pre.output{background:var(--subtle);color:var(--ink)}
.composer-area{padding:0 18px 16px}
.composer{background:var(--field);border-color:var(--line);border-radius:12px}
.composer:focus-within{border-color:var(--focus)}
.composer textarea{font-size:13px}
.composer textarea::placeholder{color:var(--muted)}
.composer-note{font-size:10px;color:var(--muted)}
.text-button{color:var(--muted)}
.text-button span,.version-tag,.pill,.inline-code{background:var(--accent-soft);color:var(--muted)}
.splitter:hover{background:var(--focus)}
.work-header{height:62px}
.work-tabs button{color:var(--muted)}
.work-tabs button.active{color:var(--ink)}
.work-tabs button.active:after{height:2px;background:var(--ink);left:0;right:0}
.segmented{background:var(--accent-soft)}
.segmented button{color:var(--muted)}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #00000008}
.preview-stage{background:var(--stage);background-image:none;border-color:var(--line);border-radius:12px}
.preview-stage.dark{background:#1b1b1b;background-image:none}
.preview-stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%)}
.preview-status,.preview-status.warn,.preview-status.error{color:var(--muted)}
.preview-status.error{font-weight:550}
.sample-panel details{background:var(--surface);border-color:var(--line)}
.sample-panel textarea{background:var(--field);color:var(--ink)}
.subtabs button{background:var(--surface);color:var(--muted)}
.subtabs button.active{background:var(--accent-soft);color:var(--ink);border-color:var(--line)}
.code-editor,.form-input{background:var(--field);border-color:var(--line);color:var(--ink)}
.caption,.resource-list,.download-note,.limit-list,.test-state,.test-result-box,.form-row small{font-size:11px;color:var(--muted)}
.form-label,.checkbox-label{color:var(--ink)}
.card,.case-item,.choice-card,.file-chip,.menu-list button{background:var(--surface);border-color:var(--line);color:var(--ink)}
.card p,.font-card small,.choice-card small,.file-chip small{color:var(--muted)}
.choice-card svg,.menu-list button svg,.file-chip svg{color:var(--muted)}
.notice,.notice.warn,.notice.error,.issue{background:var(--subtle);color:var(--muted);border-color:var(--line)}
.notice.error,.issue{border-left:3px solid var(--muted)}
.case-result,.case-result.fail{color:var(--muted)}
.modal{background:var(--raised);border-color:var(--glass-edge);box-shadow:0 18px 70px #00000020}
.modal::backdrop{background:#0004;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-head,.modal-foot{background:var(--raised)}
.diff-line.add{background:var(--accent-soft);color:var(--ink);border-left:2px solid var(--muted)}
.diff-line.del{background:var(--subtle);color:var(--muted);border-left:2px dashed var(--muted)}
.toast,.toast.error{background:var(--raised);color:var(--ink);border-color:var(--line);box-shadow:0 8px 32px #00000010}
.mobile-tabs{background:var(--surface)}
.mobile-tabs button{color:var(--muted)}
.mobile-tabs button.active{color:var(--ink);background:var(--accent-soft)}

/* Independent work, conversation and input surfaces. */
:root{--page:#f2f2f2;--panel:rgba(255,255,255,.86);--surface:rgba(255,255,255,.9);--line:rgba(20,20,20,.085);--shadow:none}

.work-tabs button{font-size:12px}
.splitter{width:20px;background:transparent;border:0}
.splitter:after{inset:35% 8px;border-radius:2px;background:transparent;transition:background .15s}
.splitter:hover,.splitter:focus-visible{background:transparent}

.chat-pane{min-width:340px;overflow:visible;background:transparent;gap:16px}
.conversation-panel{display:flex;flex:1;flex-direction:column;min-height:170px;overflow:hidden}

.message{margin-top:26px}
.message:first-child{margin-top:12px}
.message-head{gap:8px;margin-bottom:12px;font-size:10px;min-height:22px}
.message-author{color:var(--ink);font-weight:500}
.message-head time{font-size:9px;opacity:.75}
.message-head .icon-button{opacity:0;transition:opacity .15s}
.message:hover .message-head .icon-button,.message:focus-within .message-head .icon-button{opacity:1}
.message.excluded{opacity:1}
.message.excluded .message-head{opacity:.65}
.message-body{font-size:13px;line-height:1.95;letter-spacing:.1px}
.message.assistant .message-content{padding:0;background:transparent;border:0;border-radius:0}

.message-result>span{display:inline-flex;align-items:center;gap:7px}
.message-result svg{width:13px;height:13px;flex-shrink:0}
.message-result .text-button{font-size:10px;padding:3px 0}
.message-result[data-result="applied"]>span{color:var(--ink)}
.message-result[data-result="pending"]{padding:10px 12px;background:var(--subtle);border-radius:7px;color:var(--ink)}
.result-tray{margin:0 20px 12px;padding:15px 16px;background:var(--subtle);border:1px solid var(--line);border-radius:10px;flex-shrink:0;max-height:190px;overflow:auto}

.result-tray-heading .icon-button{height:23px;width:23px}
.result-tray p{font-size:11px;line-height:1.8;margin:8px 0 0;color:var(--muted)}
.result-tray .result-reason{font-size:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.result-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.result-actions button{font-size:10px}
.result-actions .quiet-button{padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.composer-area{padding:16px 18px 12px;transition:border-color .15s}
.composer-area:focus-within{border-color:var(--focus)}
.request-meta{padding:0 0 12px;font-size:10px}
.request-meta button{font-size:10px;gap:6px}
.request-meta button svg{width:12px;height:12px}
.composer{padding:0;border:0;background:transparent;border-radius:0}

.composer-tools{margin-top:12px;gap:12px}

.preview-stage{background-image:none;margin:0 24px 16px;border:0;border-radius:9px;padding:28px 22px;background:var(--stage)}
.preview-status{margin:0 24px 14px}
.sample-panel{padding:0 24px 20px}
.candidate-overview{padding:24px 0 18px}
.candidate-state{font-size:10px;color:var(--muted)}
.candidate-overview h3{font-weight:500;font-size:18px;margin:12px 0}
.candidate-overview p,.candidate-reason p{font-size:12px;line-height:1.9;color:var(--muted);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.candidate-reason{padding:16px;background:var(--subtle);border:1px solid var(--line);border-radius:9px}
.candidate-reason strong,.candidate-diff h3{font-size:11px;font-weight:500;display:block;margin:0 0 9px}
.candidate-diff{padding:22px 0}
.candidate-diff .diff-summary{font-size:11px;line-height:1.8}
.candidate-raw{margin:18px 0;color:var(--muted);font-size:11px}
.no-match-option{font-size:11px;line-height:1.8;align-items:flex-start}
@media(hover:none){.message-head .icon-button{opacity:1}}

/* Clear neutral glass: each independent panel filters the background itself. */
:root[data-appearance="glass"]{
 --page:#e2e2e2;--ink:#242424;--muted:#626262;
 --panel:rgba(255,255,255,.36);--surface:rgba(255,255,255,.42);
 --field:rgba(255,255,255,.56);--raised:#f5f5f5;
 --line:rgba(30,30,30,.09);--glass-edge:rgba(255,255,255,.72);
 --stage:rgba(255,255,255,.25);--subtle:rgba(30,30,30,.035);
 --hover:rgba(255,255,255,.38);--focus:#777;
 --glass-filter:blur(22px) saturate(105%);
 --glass-shadow:0 8px 28px rgba(0,0,0,.035),0 1px 3px rgba(0,0,0,.025),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(0,0,0,.025);
}
:root[data-appearance="glass"] body{
 background-image:var(--ui-bg),linear-gradient(125deg,#f1f1f1 0%,#e4e4e4 35%,#d8d8d8 72%,#e9e9e9 100%);
}
:root[data-appearance="glass"] :is(.topbar,.work-pane,.conversation-panel,.composer-area){
 background:linear-gradient(150deg,rgba(255,255,255,.46),rgba(255,255,255,.23));
 border:1px solid rgba(255,255,255,.62);
 box-shadow:var(--glass-shadow);
 backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
}
:root[data-appearance="glass"] .topbar{background:rgba(255,255,255,.3)}
:root[data-appearance="glass"] .composer-area{background:linear-gradient(150deg,rgba(255,255,255,.58),rgba(255,255,255,.32))}
:root[data-appearance="glass"] .composer-area:focus-within{border-color:rgba(55,55,55,.22)}
:root[data-appearance="glass"] :is(.work-header,.pane-header){background:transparent;border-bottom-color:rgba(30,30,30,.055)}
:root[data-appearance="glass"] :is(.quiet-button,.export-button,.new-project,.brand-symbol){
 background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
}
:root[data-appearance="glass"] :is(.quiet-button,.export-button,.new-project):hover{background:rgba(255,255,255,.62)}
:root[data-appearance="glass"] .segmented{background:rgba(0,0,0,.045)}
:root[data-appearance="glass"] .segmented button.active{background:rgba(255,255,255,.66);box-shadow:0 1px 4px rgba(0,0,0,.04)}
:root[data-appearance="glass"] .preview-stage:not(.dark):not(.checker){background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
:root[data-appearance="glass"] .message.user .message-content{background:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
:root[data-appearance="glass"] .result-tray{background:rgba(255,255,255,.36);border-color:rgba(255,255,255,.58)}
:root[data-appearance="glass"] .modal{
 background:rgba(249,249,249,.9);border-color:rgba(255,255,255,.8);
 backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 18px 65px rgba(0,0,0,.12),inset 0 1px 0 #fff;
}
:root[data-appearance="glass"] :is(.modal-head,.modal-foot){background:transparent}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 :root[data-appearance="glass"] :is(.topbar,.work-pane,.conversation-panel,.composer-area,.modal){background:rgba(248,248,248,.96)}
}
@media(prefers-reduced-transparency:reduce){
 :root[data-appearance="glass"] :is(.topbar,.work-pane,.conversation-panel,.composer-area,.modal){background:#f7f7f7;backdrop-filter:none;-webkit-backdrop-filter:none}
}

<body>
<div id="wb-startup" aria-label="正在打开美化工作台"><img src="./assets/icon-512.png" alt="" width="512" height="512" fetchpriority="high"></div>
<div class="app" id="app">
<aside class="sidebar" id="projectNavigation" aria-label="项目导航">
  <div class="sidebar-top"><a class="brand" href="#" data-action="home" title="全部作品"><span class="brand-symbol" data-icon="layers"></span><span class="nav-label">美化工作台</span></a><button class="icon-button sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-controls="projectNavigation" aria-expanded="false" aria-label="展开项目栏" title="展开项目栏"><span data-icon="menu"></span></button></div>
  <button class="new-project" data-action="new-project" title="新建作品" aria-label="新建作品"><span data-icon="plus"></span><span class="nav-label">新建作品</span></button>
  <div class="side-label"><span class="nav-label">我的作品</span><span id="projectCount">0</span></div>
  <div class="project-list" id="projectList" tabindex="0" aria-label="作品列表"></div>
  <div class="current-project-tools" id="currentProjectTools" aria-label="当前项目操作"></div>
  <div class="sidebar-bottom"><div class="local-badge"><span class="status-dot"></span><span>保存在此浏览器</span><span id="storageLabel">本地</span></div><button class="side-action" data-action="assets" title="素材库" aria-label="素材库"><span data-icon="image"></span><span class="nav-label">素材库</span></button><button class="side-action" data-action="backup" title="备份与恢复" aria-label="备份与恢复"><span data-icon="archive"></span><span class="nav-label">备份与恢复</span></button><button type="button" class="side-action" data-wb-install title="安装美化工作台" aria-label="安装美化工作台"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span class="nav-label">安装应用</span></button><button class="side-action" data-action="settings" title="全局设置" aria-label="全局设置"><span data-icon="settings"></span><span class="nav-label">全局设置</span></button></div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="icon-button mobile-only" data-action="projects" title="项目列表" aria-label="项目列表"><span data-icon="menu"></span></button>
    <div class="project-heading"><div class="breadcrumb">工作台 <span>/</span> <span id="projectType">状态栏</span></div><button class="project-title" id="projectTitle" data-action="rename">未命名作品</button></div>
    <div class="topbar-actions"><div class="top-preview-controls" role="group" aria-label="双端预览"><button class="icon-button" data-action="device" data-device="desktop" aria-label="电脑预览" title="电脑预览"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/></svg><span>电脑</span></button><button class="icon-button" data-action="device" data-device="phone" aria-label="手机预览" title="手机预览"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg><span>手机</span></button></div><button class="icon-button" data-action="page-fullscreen" aria-label="页面全屏" title="页面全屏"><span data-icon="expand"></span></button><span class="save-state" id="saveState" role="status">正在打开</span><button class="quiet-button project-settings-button" data-action="project-settings" aria-label="项目设置" title="项目设置"><span data-icon="sliders"></span><span>项目设置</span></button></div>
  </header>
  <nav class="mobile-tabs" aria-label="工作区域"><button class="active" data-action="mobile-tab" data-tab="chat"><span data-icon="chat"></span>对话</button><button data-action="mobile-tab" data-tab="work"><span data-icon="layout"></span>作品</button></nav>
  <div class="workspace" id="workspace">
    <section class="work-pane" aria-label="当前作品">
      <div class="work-header"><div class="work-tabs" role="tablist"><button role="tab" data-action="work-tab" data-tab="preview" class="active">预览</button><button role="tab" data-action="work-tab" data-tab="code">代码</button><button role="tab" data-action="work-tab" data-tab="previous">上一版</button><button role="tab" data-action="work-tab" data-tab="resources">制作要求</button></div></div>
      <div class="work-body" id="workBody" tabindex="0" aria-label="作品内容"></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-label="调整对话与作品宽度" aria-orientation="vertical" tabindex="0"></div>
    <section class="chat-pane" aria-label="创作对话">
      <div class="conversation-panel"><div class="pane-header"><h2>创作对话</h2><button class="icon-button" data-action="context" aria-label="本轮上下文" title="本轮上下文"><span data-icon="context"></span></button></div>
      <div id="resultTray" class="result-tray" role="region" aria-label="生成状态"></div>
      <div class="chat-scroll" id="chatScroll" tabindex="0" aria-label="聊天记录"><div id="welcome"></div><div id="messages"></div><div id="generationStatus" aria-live="polite"></div></div>
      </div>
      <div class="composer-area"><div class="request-meta"><button data-action="requirements"><span data-icon="edit"></span><span id="requirementsSummary">制作要求</span><span data-icon="chevron"></span></button><span id="pendingCount"></span></div><div class="composer"><div id="composerFiles" class="composer-files"></div><textarea id="messageInput" rows="2" placeholder="说说你想调整的地方…" aria-label="输入消息"></textarea><div class="composer-tools"><div><button class="icon-button" data-action="attach" title="添加文件或图片" aria-label="添加文件或图片"><span data-icon="paperclip"></span></button><button class="text-button" data-action="context">上下文 <span id="contextCount">0</span></button></div><div class="send-actions"><button class="primary-button" id="generateButton" data-action="generate"><span data-icon="arrow-up"></span>生成</button></div></div></div><div class="composer-note">Enter 发送 · Shift+Enter 换行 · 生成才请求 AI</div></div>
    </section>
  </div>
</main>

<script>/* Settings pages and lightweight local themes. No network or artwork rendering. */
const WORKBENCH_THEMES=[
 {id:'light',name:'素白',note:'干净明亮',tone:'light',page:'#f4f4f4',surface:'#ffffff',field:'#fafafa',ink:'#202020',muted:'#6c6c6c',accent:'#242424'},
 {id:'paper',name:'暖纸',note:'温润柔和',tone:'light',page:'#ede9e1',surface:'#faf8f3',field:'#f2efe8',ink:'#39352f',muted:'#777066',accent:'#625748'},
 {id:'sage',name:'雾绿',note:'清淡安静',tone:'light',page:'#e8ede9',surface:'#f6f9f6',field:'#edf2ed',ink:'#303d35',muted:'#66786b',accent:'#4c6555'},
 {id:'mist',name:'雾蓝',note:'清爽舒展',tone:'light',page:'#e8edf1',surface:'#f7f9fb',field:'#edf1f5',ink:'#303c49',muted:'#667689',accent:'#50687f'},
 {id:"rose",name:"藕粉",note:"柔软暖调",tone:"light",page:"#efe7e7",surface:"#fbf7f7",field:"#f4eded",ink:"#493839",muted:"#866f72",accent:"#806367"},
 {id:"lavender",name:"藤灰",note:"轻柔雾紫",tone:"light",page:"#ebe8ef",surface:"#f9f7fb",field:"#f1edf5",ink:"#40394b",muted:"#7c7289",accent:"#71637f"},
 {id:"sand",name:"沙杏",note:"安静暖杏",tone:"light",page:"#eee8e0",surface:"#fbf8f3",field:"#f4eee6",ink:"#483d33",muted:"#867667",accent:"#806b55"},
 {id:"celadon",name:"青瓷",note:"温和青灰",tone:"light",page:"#e5edeb",surface:"#f5faf8",field:"#eaf2ef",ink:"#324440",muted:"#688079",accent:"#526f67"},
 {id:'dark',name:'墨黑',note:'纯粹深色',tone:'dark',page:'#111111',surface:'#1b1b1b',field:'#222222',ink:'#eaeaea',muted:'#a5a5a5',accent:'#e8e8e8'},
 {id:'slate',name:'夜航',note:'柔和暗调',tone:'dark',page:'#171d24',surface:'#212a33',field:'#27323d',ink:'#e0e6ed',muted:'#a0adbb',accent:'#c5d4e2'},
 {id:"plum",name:"暮紫",note:"沉静深紫",tone:"dark",page:"#211e27",surface:"#2b2733",field:"#332e3c",ink:"#e9e3ee",muted:"#b0a4bc",accent:"#d3c5dd"},
 {id:'glass',name:'清透',note:'黑白玻璃',tone:'light',page:'#e5e5e5',surface:'#ffffffb8',field:'#ffffffb3',ink:'#202020',muted:'#6c6c6c',accent:'#242424'}
];
let settingsSession=null;
function workbenchTheme(id){return WORKBENCH_THEMES.find(t=>t.id===id)||WORKBENCH_THEMES[0];}
function applyWorkbenchTheme(id){const theme=workbenchTheme(id),root=document.documentElement;root.dataset.appearance=theme.id;root.dataset.palette=theme.tone;root.dataset.material=theme.id==='glass'?'glass':'solid';syncBuiltinTheme(theme.id);}
function settingsTab(id,label,glyph,active){return `<button type="button" role="tab" id="settings-tab-${id}" aria-controls="settings-panel-${id}" aria-selected="${active===id}" tabindex="${active===id?0:-1}" data-action="settings-section" data-section="${id}">${icon(glyph)}<span>${label}</span>${icon('chevron')}</button>`;}
function settingsSection(id,title,note,body,active){return `<section class="settings-panel" role="tabpanel" id="settings-panel-${id}" aria-labelledby="settings-tab-${id}" ${active===id?'':'hidden'}><header class="settings-section-heading"><h3>${title}</h3><p>${note}</p></header>${body}</section>`;}

function renderPlanning(){const focus=capturePlanningFocus();const p=P(),v=ensurePlanning(p),live=busy?.projectId===p.id&&busy.planningPreview,done=v.todos.filter(t=>t.done).length;renderWorkView(`<div class="planning-view"><header class="planning-heading"><div><h2>制作要求</h2><p>把想法留下，和 AI 一起推进。</p></div><span id="planningSaved" class="caption" role="status">${v.updatedBy==='ai'?'AI 已更新 · ':''}自动保存</span></header><section class="planning-section"><label class="planning-label" for="boardRequirements">作品要求</label><textarea class="planning-editor" id="boardRequirements" placeholder="想做什么、喜欢的风格、需要保留的字段…">${esc(p.requirements)}</textarea></section><section class="planning-section"><div class="planning-section-head"><h3>待办 <span class="caption">${done} / ${v.todos.length}</span></h3><button class="text-button" data-action="add-planning-todo">${icon('plus')}添加</button></div><div class="planning-todos">${v.todos.map(t=>`<div class="planning-todo ${t.done?'is-done':''}"><button class="todo-state text-button" data-action="toggle-planning-todo" data-id="${esc(t.id)}" aria-pressed="${t.done}">${t.done?'完成':'待做'}</button><input class="todo-text" aria-label="待办内容" data-todo-text="${esc(t.id)}" value="${esc(t.text)}" placeholder="记录下一步…"><button class="icon-button" data-action="delete-planning-todo" data-id="${esc(t.id)}" aria-label="删除待办">${icon('close')}</button></div>`).join('')||'<p class="planning-empty">添加一项，或让 AI 根据对话整理。</p>'}</div></section><section class="planning-section"><label class="planning-label" for="boardNotes">制作笔记</label><textarea class="planning-editor planning-notes" id="boardNotes" placeholder="设计决定、已完成的调整、下次继续的地方…">${esc(v.notes)}</textarea></section><div id="planningLive" class="planning-live" ${live?'':'hidden'} role="status" aria-live="polite"></div>${p.planningSuggestion?'<div class="planning-pending"><span>你编辑期间，AI 提供了一份新的制作记录。</span><button class="text-button" data-action="review-planning">查看</button></div>':''}</div>`);if(live)paintPlanningPreview(busy) function normalizeAIPlanning(data,snapshot){if(!data||typeof data!=='object'||Array.isArray(data))throw Error('制作记录格式无效');if(data.baseRevision!==ensurePlanning(snapshot).revision)throw Error('制作记录版本已变化');const out={baseRevision:data.baseRevision};if('todos' in data){if(!Array.isArray(data.todos)||data.todos.length>100)throw Error('待办数量或格式无效');const ids=new Set();out.todos=data.todos.map(t=>{if(!t||typeof t.text!=='string'||!t.text.trim()||t.text.length>2000||typeof t.done!=='boolean')throw Error('待办内容无效');const id=typeof t.id==='string'&&t.id.length<=100&&t.id?t.id:uid();if(ids.has(id))throw Error('待办标识重复');ids.add(id);return {id,text:t.text,done:t.done};});}if('notes'in data){if(typeof data.notes!=='string'||data.notes.length>30000)throw Error('制作笔记格式无效');out.notes=data.notes;}return out;}
function applyAIPlanning(data,request,p,failed=false){if(!request.active||!data.planning)return;let patch;try{patch=normalizeAIPlanning(data.planning,request.snapshot);}catch{return;}const v=ensurePlanning(p);if(failed||v.revision!==patch.baseRevision||p.requirements!==request.snapshot.requirements){p.planningSuggestion=patch;return;}if(!('todos'in patch)&&!('notes'in patch))return;if(patch.todos)v.todos=patch.todos;if('notes'in patch)v.notes=patch.notes;v.revision++;v.updatedAt=now();v.updatedBy='ai';p.planningSuggestion=null;}
function extractStreamPlanning(raw){let depth=0,inString=false,escape=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(inString){if(escape)escape=false;else if(c==='\\')escape=true;else if(c==='"')inString=false;continue;}if(c==='"'){if(depth===1&&raw.slice(i,i+10)==='"planning"'){const tail=raw.slice(i+10).match(/^\s*:\s*/);if(!tail)return null;const start=i+10+tail[0].length;if(raw[start]!=='{')return null;let d=0,str=false,escp=false;for(let j=start;j<raw.length;j++){const x=raw[j];if(str){if(escp)escp=false;else if(x==='\\')escp=true;else if(x==='"')str=false;}else if(x==='"')str=true;else if(x==='{')d++;else if(x==='}'&&!--d){try{return JSON.parse(raw.slice(start,j+1));}catch{return null;}}}return null;}inString=true;}else if(c==='{')depth++;else if(c==='}')depth--;}return null;}

function handleRefinedInput(e){const p=P();if(!p)return;if(e.target.id==='modelSearch'){renderModelCatalog();return;}if(e.target.id==='apiModel'){renderModelCatalog();return;}if(e.target.id==='boardRequirements'){p.requirements=e.target.value;touchPlanning(p);const summary=$('#requirementsSummary');if(summary)summary.textContent=p.requirements?'制作要求 · 已记录':'添加制作要求';}if(e.target.id==='boardNotes'){ensurePlanning(p).notes=e.target.value;touchPlanning(p);}if(e.target.dataset.todoText){const t=ensurePlanning(p).todos.find(t=>t.id===e.target.dataset.todoText);if(t){t.text=e.target.value;touchPlanning(p);}}}

async function loadModelCatalog(){const status=$('#modelFetchStatus'),button=$('[data-action="fetch-models"]'),sequence=++modelFetchSequence;if(!status)return;button.disabled=true;status.textContent='正在读取模型…';try{const a=apiForm();const res=await fetch(modelsURL(a.baseUrl),{headers:a.key?{Authorization:'Bearer '+a.key}:{}});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const items=data.data||data.models||[];if(!Array.isArray(items))throw Error('模型列表格式无法识别');const models=[...new Set(items.map(m=>typeof m==='string'?m:m?.id||m?.name).filter(m=>typeof m==='string'&&m.trim()))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(sequence!==modelFetchSequence||!status.isConnected)return;fetchedModels=models;$('#modelPicker').hidden=false;status.textContent=models.length?'已读取 '+models.length+' 个模型，点击下方选择。':'接口没有返回可用模型，可直接填写名称。';renderModelCatalog();}catch(e){if(sequence===modelFetchSequence&&status.isConnected)status.textContent=friendlyNetworkError(e);}finally{if(sequence===modelFetchSequence&&button.isConnected)button.disabled=false;}}

const CONTINUE_RESPONSE='上一条 JSON 因长度限制或传输中断而未完成。只继续输出尚未完成的剩余字符，不重复已有内容，不添加解释或代码围栏。';

// Only AI-edited samples are constrained here; manually entered narrative stays intact.
function requestedNarrativeUpdate(snapshot){
  const text=[...snapshot.messages].reverse().find(m=>m.role==='user'&&m.selected!==false)?.text||'';
  const clauses=text.split(/[，。！？；,;\n]/).filter(c=>!/(?:不要|无需|不必|禁止|别|不改|保持|不变|原样)/.test(c));
  return clauses.some(c=>/(?:生成|增加|加入|新增|扩写|改写|修改|更新|补充|更换|包含|带上|连同).{0,16}(?:正文|剧情|旁白|叙事)|(?:正文|剧情|旁白|叙事).{0,16}(?:生成|增加|加入|扩写|改写|修改|更新|补充)|(?:add|include|write|rewrite|expand|change).{0,24}(?:narrative|story|prose)/i.test(c));
}
async function validateGeneratedSample(result,art,request,p){
  if(p.type!=='status'||art.sample===request.snapshot.artifact.sample||!result?.ok||!result.matchCount)return;
  const normalize=text=>String(text||'').replace(/\r\n?/g,'\n').trim();
  const outside=normalize(result.unmatched);
  if(!outside||requestedNarrativeUpdate(request.snapshot))return;
  const before=await runRegex(request.snapshot.artifact,request.snapshot.regex);
  if(before.ok&&before.matchCount&&outside===normalize(before.unmatched))return;
  throw new Error('测试文本中有新增长文落在状态标识匹配范围之外。请把用于测试的长内容写入现有状态块内的真实字段，保留正确首尾标识、字段名、分隔符和换行；沿用已有正文，不在标识外追加示例说明。若字段只支持单行，长内容仍写同一行；需要多行时同步更新世界书和正则。返回完整 sample，使长文实际进入 HTML 渲染。');
}

function pendingRepairMessage(candidate){
  return {role:'user',content:'请基于当前已采用的作品，直接完成尚未处理的修改，并同时满足本轮最新要求。上次没有更新作品的原因：'+(candidate.error||'回复未完成')+'。自行修正格式、捕获组、匹配或合并问题，返回可检查并采用的实际修改，不要让用户再次点击处理。局部替换不可靠时返回完整字段 content；保留完整 HTML。以下是未采用参考，不能当作当前作品，也不能覆盖用户后来的编辑：\n<未采用参考>\n'+(candidate.raw||(candidate.artifact?JSON.stringify(candidate.artifact):'未收到完整作品'))+'\n</未采用参考>'};
}

function generationFiles(snapshot,ids){
  return snapshot.messages.filter(m=>ids.includes(m.id)).flatMap(m=>(m.files||[]).filter(f=>f.selected!==false).map(f=>({id:f.id,name:f.name,kind:f.kind,chars:f.kind==='text'?f.text.length:0})));
}

function prepareAutomaticRepair(request,p,error){
  request.repairCount=(request.repairCount||0)+1;
  const reference={error:error.message,raw:request.raw,artifact:error.candidateArtifact};
  request.snapshot=clone(p);
  request.revision=p.revision;
  request.selectedIds=request.snapshot.messages.filter(m=>m.selected!==false).map(m=>m.id);
  request.messages=makeRequestMessages(request.snapshot,request.api);
  request.messages.push(pendingRepairMessage(reference));
  request.continuationBaseMessages=clone(request.messages);
  request.raw='';
  request.initialRaw='';
  request.finishReason=null;
  request.mustResolvePending=true;
  request.phase='repair';
  request.planningPreview=null;
  const live=P().id===p.id&&$('#planningLive');if(live)live.hidden=true;
  request.lastPlanningPaint=0;
  request.status='正在自动修正并检查…（'+request.repairCount+'/'+MAX_AUTO_REPAIRS+'）';
}

function prepareAutomaticContinuation(request){
  request.continueCount=(request.continueCount||0)+1;
  request.messages=clone(request.continuationBaseMessages);
  request.messages.push({role:'assistant',content:request.raw},{role:'user',content:CONTINUE_RESPONSE});
  request.initialRaw=request.raw;
  request.finishReason=null;
  request.phase='continue';
  request.status='正在自动接续未完成的回复…（'+request.continueCount+'/'+MAX_AUTO_CONTINUATIONS+'）';
}

async function receiveGenerationAttempt(request,attempt){
  const body={model:request.api.model,messages:request.messages,stream:request.api.stream!==false};
  if(request.api.temperature!=='')body.temperature=Number(request.api.temperature);
  if(request.api.maxTokens!=='')body.max_tokens=Number(request.api.maxTokens);
  request.audit.state='transmitting';
  const res=await fetch(completionURL(request.api.baseUrl),{method:'POST',headers:{'Content-Type':'application/json',...(request.api.key?{Authorization:'Bearer '+request.api.key}:{})},body:JSON.stringify(body),signal:request.controller.signal});
  request.audit.responseReceived=true;
  attempt.responseReceived=true;
  if(!res.ok)throw new Error('API 请求失败（HTTP '+res.status+'）：'+await res.text());
  if(!request.active)return;
  request.status=request.phase==='repair'?'正在接收自动修正结果…':request.phase==='continue'?'正在自动接续回复…':'正在接收回复…';
  renderBusy();
  const contentType=res.headers.get('content-type')||'';
  if(body.stream&&contentType.includes('text/event-stream')){
    try{await consumeSSE(res,request);}catch(e){e.canContinue=request.raw.length>request.initialRaw.length;throw e;}
  }else{
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
    const choice=data.choices?.[0],content=choice?.message?.content;
    if(typeof content!=='string')throw new Error('接口没有返回可读取的文本内容');
    request.raw+=content;
    request.finishReason=choice.finish_reason||'stop';
  }
}

async function runGenerationToCompletion(request,p){
  request.continuationBaseMessages=request.continuationBaseMessages||clone(request.messages);
  request.audit.attempts=[];
  for(let number=1;number<=MAX_GENERATION_ATTEMPTS&&request.active;number++){
    const attempt={number,kind:request.phase||'generate',baseRevision:request.revision,at:now(),state:'transmitting',responseReceived:false,messageIds:clone(request.selectedIds),files:generationFiles(request.snapshot,request.selectedIds)};
    request.audit.attempts.push(attempt);
    for(const f of attempt.files)if(!request.audit.files.some(x=>x.id===f.id))request.audit.files.push(f);
    try{
      await receiveGenerationAttempt(request,attempt);
      if(!request.active){attempt.state='stopped';return;}
      if(request.finishReason==='length'){
        const e=new Error('输出达到服务商长度限制。');e.canContinue=true;e.automaticEligible=true;throw e;
      }
      if(request.finishReason==='content_filter')throw new Error('服务商中止了输出，已保留收到的草稿。');
      request.status='正在检查并完成作品…';renderBusy();
      try{await finishGeneration(request,p,{deferFailure:true});}catch(e){e.automaticEligible=true;throw e;}
      attempt.state=request.active?'completed':'stopped';
      if(request.active)request.audit.state='completed';
      return;
    }catch(error){
      attempt.state=request.active?'failed':'stopped';
      attempt.error=friendlyNetworkError(error).split(request.api.key||'\u0000').join(request.api.key?'[密钥已隐藏]':'\u0000');
      attempt.chars=request.raw.length;
      attempt.finishReason=request.finishReason;
      if(!request.active)return;
      request.failedArtifact=error.candidateArtifact||null;
      if(request.raw)request.lastFailure={raw:request.raw,artifact:request.failedArtifact,baseRevision:request.revision,messages:clone(request.messages),baseMessages:clone(request.continuationBaseMessages),selectedIds:clone(request.selectedIds),requirements:request.snapshot.requirements};
      const changed=p.revision!==request.revision||p.requirements!==request.snapshot.requirements||p.artifact.sample!==request.snapshot.artifact.sample;
      const room=number<MAX_GENERATION_ATTEMPTS;
      if(room&&!p.manualDraft&&!changed&&error.canContinue&&(request.continueCount||0)<MAX_AUTO_CONTINUATIONS){
        prepareAutomaticContinuation(request);renderBusy();saveSoon();continue;
      }
      if(room&&!p.manualDraft&&(error.automaticEligible||error.canContinue)&&(request.repairCount||0)<MAX_AUTO_REPAIRS){
        prepareAutomaticRepair(request,p,error);renderBusy();saveSoon();continue;
      }
      if(request.repairCount||request.continueCount){
        const finalError=new Error('已自动处理 '+((request.repairCount||0)+(request.continueCount||0))+' 次，仍未能完成：'+error.message);
        finalError.candidateArtifact=error.candidateArtifact;throw finalError;
      }
      throw error;
    }
  }
}

function failedGenerationCandidate(request,error){
  const previous=!request.raw&&request.lastFailure;
  const frame=previous||{raw:request.raw,artifact:request.failedArtifact,baseRevision:request.revision,messages:request.messages,baseMessages:request.continuationBaseMessages,selectedIds:request.selectedIds,requirements:request.snapshot.requirements};
  return {id:request.id,raw:frame.raw,artifact:frame.artifact||undefined,baseRevision:frame.baseRevision,error,resumeMessages:frame.messages,resumeBaseMessages:frame.baseMessages,resumeSelectedIds:frame.selectedIds,resumeRequirements:frame.requirements,resumeFileAudit:request.audit.files,resumeAvailable:!!frame.raw&&(request.finishReason==='length'||/中断|流式|连接|停止/.test(error))};
}

function typographySettings(v){const t=typographyValues(v);return '<div class="settings-typography"><div class="settings-typography-heading"><strong>文字与输入</strong><span>默认 13px</span></div>'+settingField('settingUiFontSize','界面文字大小',`<select id="settingUiFontSize" class="form-input">${[12,13,14,15,16].map(n=>`<option value="${n}" ${t.uiFontSize===n?'selected':''}>${n}px</option>`).join('')}</select>`,'调整设置、按钮和会话区域的常用文字。')+settingField('settingFieldFontSize','方框内文字大小',`<select id="settingFieldFontSize" class="form-input">${[12,13,14,15,16].map(n=>`<option value="${n}" ${t.fieldFontSize===n?'selected':''}>${n}px</option>`).join('')}</select>`,'输入框、选择框和编辑框默认使用 13px。')+settingField('settingTextLineHeight','编辑行距',`<select id="settingTextLineHeight" class="form-input">${[['1.6','紧凑'],['1.8','舒适'],['2.0','宽松']].map(([n,label])=>`<option value="${n}" ${Number(t.textLineHeight)===Number(n)?'selected':''}>${label} · ${n}</option>`).join('')}</select>`,'长文本编辑时保持清楚，不改变作品自身的字体。')+'<button type="button" class="text-button typography-defaults" data-action="typography-defaults">恢复默认字号</button></div>';}

const PREVIOUS_GREETING_FORM_TEMPLATE="```html\n<!DOCTYPE html>\n<html lang=\"zh-CN\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>\n:root{--paper:#fff;--ink:#262626;--muted:#777;--line:#e7e7e7;--soft:#f6f6f6}@media(prefers-color-scheme:dark){:root{--paper:#191919;--ink:#e8e8e8;--muted:#aaa;--line:#3b3b3b;--soft:#242424}}\nhtml,body{margin:0;background:transparent}.stform01,.stform01 *,.stform01 *::before,.stform01 *::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}.stform01{width:100%;max-width:100%;min-width:0;padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:14px/1.8 -apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Microsoft YaHei\",sans-serif;overflow-x:hidden;overflow-wrap:anywhere}.stform01 h1{margin:0 0 8px;font-size:22px;font-weight:500}.stform01 p{margin:0 0 24px;color:var(--muted)}.stform01 label{display:block;margin:16px 0 6px;font-size:12px;color:var(--muted)}.stform01 input,.stform01 textarea{display:block;width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.7;resize:vertical}.stform01 textarea{min-height:140px}.stform01-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.stform01 button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;cursor:pointer}.stform01 button:disabled{opacity:.55;cursor:wait}.stform01 :focus,.stform01 :focus-visible{outline:none;box-shadow:none}.stform01-feedback{margin-top:12px;color:var(--muted);font-size:12px;min-height:1.8em}.stform01-result{display:none}.stform01-result[open]{display:block;margin-top:16px}.stform01-result summary{cursor:pointer;color:var(--muted)}@media(prefers-reduced-motion:reduce){.stform01 *{animation:none;transition:none}}\n</style></head><body><section class=\"stform01\" id=\"stform01-root\"><h1>从你的设定开始</h1><p>填写开场内容，再复制、剪切或发送。</p><label for=\"stform01-name\">你的称呼</label><input id=\"stform01-name\" value=\"旅人\" autocomplete=\"off\"><label for=\"stform01-scene\">开场场景</label><input id=\"stform01-scene\" value=\"雨夜的旧书店\" autocomplete=\"off\"><label for=\"stform01-content\">开场内容</label><textarea id=\"stform01-content\">我推开旧书店的门，收起还在滴水的雨伞，望向柜台后的人。</textarea><div class=\"stform01-actions\"><button type=\"button\" data-form-action=\"copy\">复制</button><button type=\"button\" data-form-action=\"cut\">剪切</button><button type=\"button\" data-form-action=\"send\">发送并续写</button></div><div class=\"stform01-feedback\" role=\"status\" aria-live=\"polite\"></div><details class=\"stform01-result\"><summary>待复制内容</summary><textarea readonly aria-label=\"手动复制的完整内容\"></textarea></details></section><script>\n(function(){const root=document.getElementById('stform01-root'),out=root.querySelector('.stform01-feedback'),result=root.querySelector('.stform01-result');let sending=false,submittedText='';const fields=['#stform01-name','#stform01-scene','#stform01-content'].map(s=>root.querySelector(s));function content(){return fields.map((f,i)=>f.value.trim()?['称呼：','场景：',''][i]+f.value.trim():'').filter(Boolean).join('\\n');}async function copy(text){if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){try{await navigator.clipboard.writeText(text);return;}catch{}}const temp=document.createElement('textarea');temp.value=text;temp.setAttribute('aria-label','复制内容');temp.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';root.append(temp);temp.select();temp.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch{}temp.remove();if(!ok){result.open=true;result.querySelector('textarea').value=text;throw new Error('浏览器没有允许复制，请在下方长按选中文本；原内容已保留。');}}root.addEventListener('click',async e=>{const button=e.target.closest('[data-form-action]');if(!button||!root.contains(button)||sending)return;const action=button.dataset.formAction,text=content();if(!fields[2].value.trim()){out.textContent='请先填写开场内容。';return;}if(action==='copy'||action==='cut'){try{await copy(text);if(action==='cut')fields.forEach(f=>{f.value='';});result.open=false;out.textContent=action==='cut'?'已剪切。':'已复制，填写内容已保留。';}catch(err){out.textContent=err.message;}return;}let sent=text===submittedText;sending=true;root.querySelectorAll('[data-form-action]').forEach(b=>{b.disabled=true;});try{if(typeof createChatMessages!=='function'||typeof triggerSlash!=='function')throw new Error('此操作需要启用酒馆助手；也可以复制内容后在酒馆中手动发送。');if(!sent){await createChatMessages([{role:'user',message:text}]);submittedText=text;sent=true;}out.textContent='内容已发送，正在请求续写…';await triggerSlash('/trigger');out.textContent='已发送并请求续写。';}catch(err){out.textContent=(sent?'内容已经发送，续写未完成；请勿重复发送。':'尚未发送。')+' '+err.message;}finally{button.textContent=sent?'继续或重试续写':'发送并续写';sending=false;root.querySelectorAll('[data-form-action]').forEach(b=>{b.disabled=false;});}});})();\n<\/script></body></html>\n```";

const REFERENCE_PROMPT="《提示词》\n你是一名精通 SillyTavern 正则美化系统的前端设计师。\n\n我将描述一个状态栏的视觉效果需求，你需要为我生成一套可以直接在 SillyTavern 1.15.0 中使用的完整状态栏美化方案。\n\n在为我生成 HTML/CSS 前端排版代码时，必须严格遵守以下移动端适配铁律，杜绝不同设备的排版错乱或横向溢出问题：\n\n1. 【流式与弹性容器】：最外层卡片容器绝对禁止使用固定像素宽度（如 width: 600px），必须采用相对宽度与最大宽度结合的方案，例如：`width: 98%; max-width: 600px;`。\n2. 【全局盒模型防护】：最外层容器及所有内部元素必须显式或通过通配符包含 `box-sizing: border-box;`，确保 padding 和 border 不会撑爆父容器的设定宽度。\n3. 【强制锁死横向滚动】：在最外层卡片容器上必须设置 `overflow-x: hidden;`，同时对内部长文本区块使用 `word-wrap: break-word;` 或 `word-break: break-all;`，防止连续字符撑宽导致左右滑动。\n4. 【摒弃绝对定位排版】：绝对禁止使用 `position: absolute` 配合死像素（如 left: 300px）来对齐左右侧元素（如按钮、徽章）。必须采用 Flex 布局（`display: flex;`），配合 `justify-content: space-between;` 或 `justify-content: flex-end;` 来实现自适应对齐。\n5. 【去焦与系统避让】：对所有可点击交互元素（包含卡片外层与 summary）必须加入 `outline: none;` 和 `-webkit-tap-highlight-color: transparent;` 去除系统焦点蓝框；注意避让移动端安全区域。\n6. 【深浅色自适应】：在生成 CSS 样式时，必须始终包含针对暗色模式的适配。首先在 :root 声明一套默认的浅色模式变量（如背景色、文本色、边框色等），随后紧跟 `@media (prefers-color-scheme: dark)` 媒体查询，在其中重新定义这些 CSS 变量以反转为深色模式。整个样式布局必须依赖这些 CSS 变量，确保状态栏在不同主题下色彩表现自然且保持极高对比度与辨识度，无需依赖 JavaScript 进行切换。\n\n\n---\n\n## 工作原理\n\n本方案只针对消息末尾的状态栏，正文不做任何包裹或美化。\n\n渲染流程：\n\n1. 世界书条目要求 AI 在每次回复正文末尾附加一段固定格式的纯文本状态标记。\n2. 正则表达式捕获这段状态标记中的各字段。\n3. 捕获结果通过变量（$1, $2, $3...）填入正则替换为的 HTML 模板，替换后作为 HTML 片段直接注入聊天消息的 DOM 节点中渲染。\n\n正文正常输出，正则只匹配末尾状态标记区域。\n\n---\n\n## 输出规范\n\n你必须输出以下四个部分，每部分完整、独立、用代码块包裹。不输出多余解释。\n\n如果我后续要求修改或修复，默认重新输出全部四个部分的完整内容。不输出片段，不说\"将某处改为\"。我需要直接复制使用。只有当我明确说\"只改样式\"时，才可以只输出完整的正则替换为部分。\n\n输出全部四个部分后，必须执行以下自检，不通过则修正后重新输出：\n\n自检1-前缀一致性：逐字段核对世界书条目中的前缀名、正则表达式中的前缀名、正则替换为HTML中标签显示的前缀名、示例渲染文本中的前缀名——四者必须逐字符完全相同。任何一处不一致都会导致渲染失败。\n\n自检2-正则完整性：正则表达式必须以 【状态栏】\\n 开头，以 \\n【\\/状态栏】 结尾。【\\/状态栏】 是正则的最后一个内容，后面不能有任何其他字符、注释或空行。\n\n自检3-字段数量一致性：世界书条目中定义的字段数量 = 正则中的捕获组数量 = 正则替换为中使用的 $ 变量数量 = 示例渲染文本中的字段数量。四者必须相等。\n\n自检4-正则纯净性：正则表达式代码块内只能有表达式本身这一行内容。不能包含注释、变量映射说明、空行或任何其他文字。用户会将代码块内容完整粘贴到酒馆输入框，任何多余内容都会被当作正则的一部分导致匹配失败。\n\n---\n\n### 一、世界书条目\n\n写入世界书 Content 区域的纯文本指令。\n\n要求：\n- 指导 AI 在每次回复正文结束后，另起一行，按固定格式附加状态信息。\n- 使用【状态栏】和【/状态栏】包裹整个状态区域。\n- 内部每个字段使用\"中文前缀：内容\"格式（如 动作：轻轻蹭着你的手指），每行一个字段，每行顶格书写。\n- 前缀使用全角冒号\"：\"，冒号后紧跟内容，不加空格。必须在条目中明确告知 AI 这一点。\n- 明确告知 AI：状态栏内每个字段的内容必须保持单行输出，不可换行。\n- 明确告知 AI：【状态栏】后紧跟换行直接开始第一个字段，最后一个字段后紧跟换行直接写【/状态栏】，字段之间不插入空行。\n- 若某字段需要两层信息（如摘要与详情），用竖线 | 在同一行内分隔。\n- 用 {{描述}} 占位说明每个字段应填什么，标注字数建议（如\"10-25字\"）。\n- 明确告知 AI：正文正常书写，不包裹在任何标记中；只有末尾状态信息使用规定格式。\n- 明确禁止 AI 在状态标记区域输出 HTML、Markdown 或代码块。\n\n---\n\n### 二、正则表达式\n\n**只输出纯表达式本身。代码块内有且只有一行——正则表达式。不含首尾斜杠 /，不含标志位，不含注释，不含变量映射说明，不含空行。用户会将代码块内容完整粘贴到酒馆输入框，任何多余内容都会导致渲染失败。**\n\n结构规则：\n- 以 【状态栏】\\n 开头。\n- 以 \\n【\\/状态栏】 结尾。这是表达式的最后内容，后面不再有任何字符。\n- 字段之间以 \\n 作为精确分隔锚点。\n- 每个字段格式为：中文前缀：(.+?)，由紧随其后的 \\n 作为惰性匹配的停止锚点。\n- 在 dot all 模式下 . 能匹配换行符，但 (.+?) 遇到后方的 \\n 字面量时会停止。\n- 若某字段用竖线分隔两层信息，使用 (.+?)\\|(.+?) 拆为两个独立捕获组，整体仍由后方 \\n 锚定。\n- 捕获组顺序必须与正则替换为中的 $1, $2, $3... 严格一一对应。\n\n变量映射说明放在代码块外面，用普通文本标注（如：$1=动物塑, $2=颜文字...），方便人类阅读但不会被粘贴进酒馆。\n\n标准范例：\n\n代码块内只有这一行：\n```\n【状态栏】\\n前缀A：(.+?)\\n前缀B：(.+?)\\n前缀C：(.+?)\\n【\\/状态栏】\n```\n代码块外注明：$1=A, $2=B, $3=C\n\n---\n\n### 三、正则替换为\n\n正则匹配成功后渲染的状态栏 HTML。这是本方案的核心产出。\n\n**文档结构规则（必须严格遵守）：**\n\n正则替换为的内容必须是一个完整的 HTML 文档结构：\n\n```\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n（<link> 外部字体引入放这里）\n（<style> 样式声明放这里）\n</head>\n\n（状态栏的可见 HTML 元素放这里）\n（如有 <script> 放这里）\n\n</html>\n```\n\n- 必须以 <!DOCTYPE html> 开头。\n- 必须有 <html lang=\"zh-CN\"> 包裹。\n- <link> 和 <style> 标签必须放在 <head> 内部。\n- 状态栏可见元素放在 </head> 之后、</html> 之前。\n- 不包含 <body> 标签。\n\n这个完整文档结构是酒馆正则替换系统正确解析 <style> 和 <link> 标签的必要条件。\n\n**可用技术（SillyTavern 1.15.0）：**\n\n- <style> 标签（放在 <head> 内）：class、伪元素、CSS 变量、@keyframes 动画、transition、transform、hover/active/focus 伪类、媒体查询、属性选择器。\n- class 属性：配合 <style> 完全生效。\n- <script> 标签：注入 DOM 后执行。可用于交互逻辑。\n- <button> 标签：配合 script 事件监听。\n- <link> 外部字体（放在 <head> 内）：可引入 Google Fonts。\n- @import url()：可写在 <style> 内。\n- onclick 等用户触发事件：可用。\n- <details> + <summary>：纯 HTML 折叠交互。\n- CSS 动画、backdrop-filter、外链图片、checkbox hack：均可用。\n\n**禁止：**\n\n- iframe、object、embed。\n- form 表单提交到外部。\n- script 中发起网络请求。\n- script 中操作当前状态栏容器以外的 DOM。\n- onload、onerror。\n\n**命名规则：**\n\n- class 命名添加至少6字符独特前缀（如 .sdexe-panel）。\n- id 同样加前缀。\n- script 中 DOM 查询限定在容器内部。\n\n**布局规则：**\n\n- 最外层可见容器设 width: 100%; margin-top: 20px;。\n- 不设固定像素 max-width。\n\n**视觉规则：**\n\n- 风格贴合我描述的主题调性。\n- 文字与背景保持对比度。\n- 外部字体必须声明系统字体 fallback。\n\n---\n\n### 四、示例渲染\n\n模拟 AI 实际输出的纯文本，用于验证渲染。\n\n要求：\n- 格式与世界书条目完全一致。\n- 【状态栏】后紧跟换行开始第一字段；最后字段后紧跟换行写【/状态栏】。\n- 全角冒号后紧跟内容无空格，字段间无空行。\n- 内容具体贴合主题，不用占位符。\n- 纯文本，不含 HTML。\n\n---\n\n## 输出格式\n\n严格按以下结构，不添加额外文字：\n\n【世界书条目】\n```text\n（完整条目内容）\n```\n\n【正则表达式】\n```text\n（仅一行：纯正则表达式主体。无注释、无映射说明、无空行。）\n```\n\n变量映射：$1=XX, $2=XX, $3=XX...（此行为普通文本说明，不在代码块内）\n\n【正则替换为】\n```html\n（完整 HTML，从 <!DOCTYPE html> 到 </html>）\n```\n\n【示例渲染】\n```text\n（纯文本）\n```";
